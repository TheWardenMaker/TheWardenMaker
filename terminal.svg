<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="350" viewBox="0 0 800 350" role="img" aria-label="Terminal affichant les métadonnées exiftool de ma photo de profil" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>exiftool avatar.png</title>
  <style>
    text{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;font-size:14px}
    .ps{fill:#f0b968}
    .t{fill:#d6dbe8}
    .k{fill:#7fc4d6}
    .d{fill:#8089a3;font-size:12px}
  </style>
  <defs>
    <clipPath id="typed"><rect x="40" y="46" height="22" width="0">
      <animate attributeName="width" begin="0.5s" dur="1.2s" fill="freeze" calcMode="discrete"
        values="0;8.4;16.8;25.2;33.6;42;50.4;58.8;67.2;75.6;84;92.4;100.8;109.2;117.6;126;134.4;142.8;151.2;159.6;168"/>
    </rect></clipPath>
    <clipPath id="photo"><rect x="570" y="48" width="200" height="200" rx="10"/></clipPath>
  </defs>

  <!-- fenêtre -->
  <rect width="800" height="350" rx="12" fill="#1a1e29"/>
  <rect x="0" y="0" width="540" height="350" rx="12" fill="#222736"/>
  <rect x="0" y="30" width="540" height="1" fill="#343b50"/>
  <text x="16" y="20" class="d">visiteur@profil: ~</text>

  <!-- commande tapée -->
  <text x="22" y="62" class="ps">$</text>
  <text x="40" y="62" class="t" clip-path="url(#typed)">exiftool avatar.png</text>
  <rect x="40" y="49" width="8" height="16" fill="#d6dbe8">
    <animate attributeName="x" begin="0.5s" dur="1.2s" fill="freeze" calcMode="discrete"
      values="40;48.4;56.8;65.2;73.6;82;90.4;98.8;107.2;115.6;124;132.4;140.8;149.2;157.6;166;174.4;182.8;191.2;199.6;208"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
    <set attributeName="display" to="none" begin="2.0s" fill="freeze"/>
  </rect>

  <!-- sortie exiftool : une ligne toutes les 0.18s à partir de 2.1s -->
  <g>
    <text x="22" y="94"  opacity="0"><tspan class="k">Nom du fichier</tspan><tspan x="200" class="t">: avatar.png</tspan><set attributeName="opacity" to="1" begin="2.10s" fill="freeze"/></text>
    <text x="22" y="114" opacity="0"><tspan class="k">Version ExifTool</tspan><tspan x="200" class="t">: 13.00</tspan><set attributeName="opacity" to="1" begin="2.28s" fill="freeze"/></text>
    <text x="22" y="134" opacity="0"><tspan class="k">Nom</tspan><tspan x="200" class="t">: Alain Arnould</tspan><set attributeName="opacity" to="1" begin="2.46s" fill="freeze"/></text>
    <text x="22" y="154" opacity="0"><tspan class="k">Pseudo</tspan><tspan x="200" class="t">: Opium </tspan><set attributeName="opacity" to="1" begin="2.64s" fill="freeze"/></text>
    <text x="22" y="174" opacity="0"><tspan class="k">Localisation</tspan><tspan x="200" class="t">: Wallonie, Belgique</tspan><set attributeName="opacity" to="1" begin="2.82s" fill="freeze"/></text>
    <text x="22" y="194" opacity="0"><tspan class="k">Langues</tspan><tspan x="200" class="t">: Français, English</tspan><set attributeName="opacity" to="1" begin="3.00s" fill="freeze"/></text>
    <text x="22" y="214" opacity="0"><tspan class="k">Métier</tspan><tspan x="200" class="t">: Étudiant / Cybersécurité (Hénallux)</tspan><set attributeName="opacity" to="1" begin="3.18s" fill="freeze"/></text>
    <text x="22" y="234" opacity="0"><tspan class="k">Langage préféré</tspan><tspan x="200" class="t">: Python</tspan><set attributeName="opacity" to="1" begin="3.36s" fill="freeze"/></text>
    <text x="22" y="254" opacity="0"><tspan class="k">OS</tspan><tspan x="200" class="t">: Windows / Linux</tspan><set attributeName="opacity" to="1" begin="3.54s" fill="freeze"/></text>
    <text x="22" y="274" opacity="0"><tspan class="k">Boisson</tspan><tspan x="200" class="t">: Café (trop)</tspan><set attributeName="opacity" to="1" begin="3.72s" fill="freeze"/></text>
    <text x="22" y="294" opacity="0"><tspan class="k">Sait quitter vim</tspan><tspan x="200" class="t">: :q </tspan><set attributeName="opacity" to="1" begin="3.90s" fill="freeze"/></text>
    <text x="22" y="314" opacity="0"><tspan class="k">Statut</tspan><tspan x="200" class="t">: Dispo pour des projets sympas</tspan><set attributeName="opacity" to="1" begin="4.08s" fill="freeze"/></text>
  </g>

  <!-- nouveau prompt -->
  <g opacity="0">
    <set attributeName="opacity" to="1" begin="4.4s" fill="freeze"/>
    <text x="22" y="338" class="ps">$</text>
    <rect x="40" y="325" width="8" height="16" fill="#d6dbe8">
      <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
    </rect>
  </g>
 <g clip-path="url(#VotreIdDeMasqueIci)"> 
    <rect x="570" y="48" width="200" height="200" fill="#222736"/>
    
    <!-- INSÉREZ VOTRE IMAGE ICI (Le bloc placeholder a été supprimé) -->
    <image id="avatar" x="570" y="48" width="200" height="200" preserveAspectRatio="xMidYMid slice" href="./Images/avatar.jpg" /> 
  </g>
  <rect x="570" y="48" width="200" height="200" fill="none" stroke="#343b50"/>
  <text x="570" y="270" class="d">avatar.png</text>
</svg>